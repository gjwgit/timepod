description: |
  TimePod shows a large clock that fills the screen, analog, digital or
  both, with the weekday and date beneath. Leave it running on a spare
  phone, tablet or monitor as a bedside or desk clock. The clock face
  drifts a little every minute so an OLED screen does not burn in.

  The app needs no login and sends nothing anywhere. A login to your
  Solid Pod is optional, ready for features that store your settings
  privately and encrypted on your own Pod.
